      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .slide-card {
      width: 100%;
      max-width: 1400px;
      aspect-ratio: 16 / 9;
      max-height: 88vh;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
      transition: all 0.3s ease;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
    }
    .navy-gradient {
      background: linear-gradient(135deg, #0A192F 0%, #003B95 60%, #0A4DB0 100%);
    }
  </style>
</head>
<body>
  <div class="slide-container">

      Sau ▶

    <div class="w-px h-4 bg-slate-700"></div>
    <span class="text-slate-400 hidden sm:inline">Phím: [←] [→] hoặc [Space]</span>
    <button onclick="toggleFullscreen()" class="text-slate-300 hover:text-white transition">
      ⛶ Toàn màn hình

  </div>

ìm kiếm nhanh theo Xây dựng, Bất động sản, Tài chính, Công nghệ..."},{"strong":"Phân trang mượt mà:","text":"Tải nhanh, hiển thị hình ảnh sản phẩm sắc nét tối ưu di động."}]},{"type":"feature","title":"Mạng Lưới Doanh Nhân Chính Danh & Hẹn 1-on-1","subtitle":"Tìm kiếm đối tác tin cậy và đặt lịch cà phê giao thương trong 30 giây","bullets":[{"strong":"Danh bạ 500+ CEO xác thực:","text":"Hội viên chính thức với huy hiệu Verified tích xanh uy tín."},{"strong":"Đặt lịch hẹn 1-on-1 tự động:","text":"Chọn khung giờ trống và gửi lời mời cà phê kết nối kinh doanh."},{"strong":"Đồng bộ lịch điện thoại:","text":"Lịch hẹn tự động cập nhật vào Google Calendar / Apple Calendar."},{"strong":"Ghi chú đối tác:","text":"Lưu trữ thông tin nhu cầu và tiềm năng hợp tác sau buổi gặp gỡ."}]},{"type":"feature","title":"Trải Nghiệm Sự Kiện: Ví Vé E-Ticket & Lucky Draw","subtitle":"Check-in không chạm, xem sơ đồ chỗ ngồi và nhận quà may mắn tại Gala","bullets":[{"strong":"Ví vé điện tử E-Ticket:","text":"Lưu cuống vé sự kiện kèm mã QR soát vé cá nhân hóa."},{"strong":"Hiển thị số ghế & phân khu:","text":"Biết trước vị trí bàn tiệc VIP được Ban Tổ Chức trân trọng bố trí."},{"strong":"Mã quay thưởng Lucky Draw:","text":"Mã số may mắn (#8388) tự động kích hoạt khi bước qua cửa soát vé."},{"strong":"Tài liệu sự kiện số:","text":"Tải nhanh kỷ yếu và tài liệu diễn đàn ngay trên ứng dụng."}]},{"type":"feature","title":"Đàm Thoại Nội Bộ Mã Hóa & Thông Báo Cuộc Gọi Nền","subtitle":"Bảo vệ bí mật kinh doanh, kết nối đàm thoại chất lượng cao không giật trễ","bullets":[{"strong":"Cuộc gọi thoại & video HD:","text":"Đàm thoại trực tiếp 1-1 với chất lượng âm thanh trong trẻo, bảo mật."},{"strong":"Dịch vụ thông báo nền Native:","text":"Đổ chuông ngay trên màn hình khóa kể cả khi ứng dụng đang đóng."},{"strong":"Ngắt máy 0ms không độ trễ:","text":"Một bên gác máy là cả hai đầu kết thúc tức thời, không chuông ảo."},{"strong":"Không bị làm phiền:","text":"Chỉ các hội viên chính danh trong hệ sinh thái mới c     let currentIndex = 0;

    function renderSlide(index) {
      const s = slides[index];
      const card = document.getElementById('slideCard');
      document.getElementById('slideIndicator').innerText = (index + 1) + ' / ' + slides.length;

      let html = '';

      if (s.type === 'cover') {
        html = `
          <div class="w-full h-full navy-gradient text-white flex flex-col justify-between p-12 sm:p-16 relative overflow-hidden">

            <div class="flex items-center justify-between z-10 border-b border-white/10 pb-6">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-400 text-slate-950 font-black flex items-center justify-center text-lg shadow-md">

              <span class="text-amber-300 font-bold mt-1 sm:mt-0">ViConnect Technology Ecosystem · 2026</span>
            </div>
          </div>
        `;
      } else if (s.type === 'comparison') {
        html = `

                    ${s.col2_items.map(it => `<li class="flex items-start gap-2.5"><span class="text-emerald-600 font-bold mt-0.5">✓</span><span>${it}</span></li>`).join('')}
                  </ul>
                </div>
              </div>
            </div>

            <div class="border-t border-slate-200 pt-3 flex justify-between text-[11px] text-slate-400">

        `;
      } else if (s.type === 'kpi') {
        html = `

            <div>
              <span class="text-xs font-black text-amber-600 uppercase tracking-widest block mb-1">CHỈ SỐ NĂNG LỰC HỆ THỐNG</span>
              <h2 class="text-2xl sm:text-3xl font-black text-[#003B95]">${s.title}</h2>
              <p class="text-xs sm:text-sm text-slate-500 mt-1">${s.subtitle}</p>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-5 my-auto pt-4">
              ${s.kpis.map(k => `
                <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col justify-between hover:border-amber-400 transition">
                  <div class="text-3xl sm:text-4xl font-black text-amber-600 font-mono tracking-tight mb-2">
                    ${k.num}
                  </div>
                  <div>
                    <div class="font-extrabold text-slate-900 text-sm mb-1">${k.label}</div>

                  </div>
                </div>
              `).join('')}
            </div>

            <div class="border-t border-slate-200 pt-3 flex justify-between text-[11px] text-slate-400">
              <span>Hệ Thống CEO 1983 · ViConnect</span>
              <span>Trang ${index + 1} / ${slides.length}</span>
            </div>
          </div>
        `;
      } else if (s.type === 'feature') {
        html = `

                  </div>
                </div>
              `).join('')}
            </div>

            <div class="border-t border-slate-200 pt-3 flex justify-between text-[11px] text-slate-400">
              <span>Hệ Thống CEO 1983 · ViConnect</span>
              <span>Trang ${index + 1} / ${slides.length}</span>
            </div>

      } else if (s.type === 'flow') {
        html = `

              <p class="text-xs sm:text-sm text-slate-500 mt-1">${s.subtitle}</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 my-auto pt-4">
              ${s.steps.map(step => `
                <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs relative flex flex-col justify-between">
                  <div class="w-9 h-9 rounded-xl bg-amber-500 text-slate-950 font-black text-sm flex items-center justify-center font-mono mb-3 shadow-xs">
                    ${step.num}
                  </div>
                  <div>
                    <div class="font-extrabold text-slate-900 text-sm mb-1.5">${step.title}</div>

                  </div>
                </div>
              `).join('')}
            </div>

            <div class="border-t border-slate-200 pt-3 flex justify-between text-[11px] text-slate-400">
              <span>Hệ Thống CEO 1983 · ViConnect</span>
              <span>Trang ${index + 1} / ${slides.length}</span>
            </div>

      } else if (s.type === 'closing') {

            </div>

            <div class="z-10 my-auto py-6">

              <p class="text-base sm:text-xl text-blue-100 mb-8 max-w-2xl font-medium">

              <div class="space-y-3.5 max-w-2xl">

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      }
    });

    renderSlide(0);
  </script>
</body>
</html>
