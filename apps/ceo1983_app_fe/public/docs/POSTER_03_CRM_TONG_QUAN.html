<!DOCTYPE html>
<html lang="vi">
<head>
  <title>POSTER 3 - NỀN TẢNG QUẢN TRỊ HIỆP HỘI CEO1983</title>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      background: #F1F5F9;
      color: #0F172A;
    }
    .poster-canvas {
      width: 1400px;
      height: 1980px;
      min-width: 1400px;
      min-height: 1980px;
      position: relative;
      background: #FFFFFF;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: 0 auto;
    }
    .bg-light-ambient {
      background: linear-gradient(180deg, #FFFFFF 0%, #F5F9FF 35%, #EAF2FE 75%, #DFEDFE 100%);
    }
    .skyline-overlay {
      position: absolute;
      top: 0;
      right: 0;
      width: 60%;
      height: 45%;
      background: radial-gradient(circle at 80% 20%, rgba(13, 148, 255, 0.15), transparent 70%);
      pointer-events: none;
    }
    .building-silhouette {
      position: absolute;
      top: 20px;
      right: 40px;
      width: 480px;
      height: 380px;
      opacity: 0.18;
      background: linear-gradient(135deg, #0A369D, #00D4FF);
      mask-image: radial-gradient(ellipse at 70% 30%, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at 70% 30%, black 40%, transparent 80%);
      pointer-events: none;
    }
    .bottom-wave-banner {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      background: linear-gradient(135deg, #072366 0%, #0A389C 50%, #104EB8 100%);
      border-top: 6px solid #FFFFFF;
      box-shadow: 0 -12px 35px rgba(10, 56, 156, 0.25);
      border-top-left-radius: 40px;
      border-top-right-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
    }
    .bottom-wave-banner::before {
      content: '';
      position: absolute;
      top: -12px;
      left: 10%;
      right: 10%;
      height: 6px;
      background: linear-gradient(90deg, transparent, #EA580C, #F59E0B, transparent);
      border-radius: 999px;
    }
    .vione-capsule {
      background: linear-gradient(135deg, #133E9A 0%, #1A4FB5 100%);
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.3);
      padding: 14px 42px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .phone-mockup-frame {
      border-radius: 52px;
      padding: 10px;
      background: linear-gradient(145deg, #2D3748, #1A202C);
      box-shadow: 0 35px 70px -15px rgba(15, 30, 65, 0.45), 0 0 30px rgba(0, 102, 255, 0.15);
      border: 3.5px solid #CBD5E1;
      position: relative;
    }
    .phone-mockup-inner {
      border-radius: 42px;
      overflow: hidden;
      background: #FFFFFF;
      position: relative;
    }
    .phone-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 96px;
      height: 24px;
      background: #000000;
      border-radius: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
    }
    .phone-lens {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #111827;
      border: 1.5px solid #374151;
    }
    .imac-mockup-frame {
      border-radius: 28px;
      padding: 12px;
      background: linear-gradient(145deg, #E2E8F0, #CBD5E1);
      box-shadow: 0 45px 90px -20px rgba(15, 30, 65, 0.35);
      border: 3px solid #94A3B8;
      position: relative;
    }
    .imac-mockup-inner {
      border-radius: 18px;
      overflow: hidden;
      background: #0F172A;
      border: 2px solid #000000;
      position: relative;
    }
    .imac-stand {
      width: 180px;
      height: 90px;
      margin: 0 auto;
      background: linear-gradient(180deg, #94A3B8 0%, #E2E8F0 100%);
      clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    }
    .imac-base {
      width: 320px;
      height: 14px;
      margin: -2px auto 0;
      background: linear-gradient(90deg, #CBD5E1, #F1F5F9, #CBD5E1);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .podium-stage {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 1250px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, #FFFFFF 0%, #E2ECFB 50%, #C9DBF6 80%, rgba(201, 219, 246, 0) 100%);
      box-shadow: 0 30px 60px rgba(10, 40, 100, 0.15);
      z-index: 1;
    }
    .podium-disc {
      position: absolute;
      bottom: 140px;
      left: 50%;
      transform: translateX(-50%);
      width: 1050px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(225, 238, 255, 0.7) 100%);
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 15px 35px rgba(10, 50, 140, 0.12);
      z-index: 2;
    }
    .feature-pill-badge {
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 20px;
      padding: 12px 18px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      width: 250px;
    }
    .grid-feature-card {
      background: #FFFFFF;
      border-radius: 26px;
      border: 1.5px solid #E2E8F0;
      box-shadow: 0 12px 30px rgba(15, 30, 65, 0.07);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }
    @page {
      size: 1400px 1980px;
      margin: 0;
    }
  </style>

</head>
