name: ceo1983-hiephoi

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runner
    image: ceo1983-backend:latest
    container_name: ceo1983-backend-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=4000
    ports:
      - "4002:4000"
    networks:
      - ceo1983-network
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ceo1983-frontend:latest
    container_name: ceo1983-frontend-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      - NODE_ENV=production
    ports:
      - "5000:5000"
    depends_on:
      - backend
    networks:
      - ceo1983-network

  db:
    image: postgres:15
    container_name: ceo1983-db-local
    restart: always
    environment:
      POSTGRES_USER: app1
      POSTGRES_PASSWORD: "5^S0CEpvYwC1(#YN1UoJ"
      POSTGRES_DB: ceo1983_project
    ports:
      - "6432:5432"
    volumes:
      - ceo1983_postgres_data:/var/lib/postgresql/data
    networks:
      - ceo1983-network

  minio:
    image: minio/minio:latest
    container_name: ceo1983-minio-local
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9050:9000"
      - "9051:9001"
    volumes:
      - ceo1983-minio-data-local:/data
    command: server /data --console-address ":9001"
    networks:
      - ceo1983-network

networks:
  ceo1983-network:
    driver: bridge

volumes:
  ceo1983_postgres_data:
  ceo1983-minio-data-local:
