name: Auto Deploy Subdomains (CEO 1983 & CRM)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target:
        description: 'Phân hệ triển khai (all / mobile / crm / ssl)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mobile
          - crm
          - ssl

jobs:
  quality-check:
    name: Kiểm Tra Chất Lượng Mã Nguồn (TypeScript Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Khởi tạo môi trường Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cài đặt dependencies
        run: npm install --legacy-peer-deps

      - name: Sinh Prisma Client (@vibe/db)
        run: |
          cd packages/db
          npx prisma generate

      - name: Sinh routes cho Frontend
        run: |
          cd apps/ceo1983_app_fe
          node scripts/gen-routes.mjs

      - name: Kiểm tra lỗi TypeScript Frontend (Exit code 0)
        run: |
          cd apps/ceo1983_app_fe
          npx tsc --noEmit

      - name: Kiểm tra lỗi TypeScript Backend (Exit code 0)
        run: |
          cd apps/ceo1983_app_be
          npx tsc --noEmit

  build-and-deploy:
    name: Đóng Gói Docker & Triển Khai Lên Subdomains
    needs: quality-check
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ secrets.REMOTE_HOST || '14.225.217.232' }}
      SERVER_USER: ${{ secrets.REMOTE_USER || 'root' }}
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Khởi tạo môi trường Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Dọn dẹp dung lượng ổ đĩa GitHub Runner (Chống đầy ổ đĩa)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h

      - name: Cài đặt dependencies
        run: npm install --legacy-peer-deps

      - name: Sinh Prisma Client (@vibe/db)
        run: |
          cd packages/db
          npx prisma generate

      - name: Sinh routes cho Frontend
        run: |
          cd apps/ceo1983_app_fe
          node scripts/gen-routes.mjs

      - name: Build Frontend với Heap Memory 5GB (Chống tràn RAM)
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"
          NEST_API_URL: "http://backend:4000"
        run: |
          npm run build --prefix apps/ceo1983_app_fe

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images cục bộ trên runner
        run: |
          # 1. Build Frontend Image từ bản build .output vừa hoàn thành
          docker build -t ceo1983-frontend:latest -f deploy/ceo1983/Dockerfile.frontend .
          docker tag ceo1983-frontend:latest crm-frontend:latest

          # 2. Build Backend Image từ root Dockerfile.backend (không dùng cache để đảm bảo code mới nhất)
          docker build --no-cache -t ceo1983-backend:latest -f Dockerfile.backend .
          docker tag ceo1983-backend:latest crm-backend:latest

          # 3. Nén images thành tar.gz với gzip mức 6 (tiết kiệm 75% dung lượng, giảm từ 1.8GB xuống ~200MB)
          mkdir -p dist-images
          docker save ceo1983-frontend:latest | gzip -6 > dist-images/frontend-images.tar.gz
          docker save ceo1983-backend:latest | gzip -6 > dist-images/backend-images.tar.gz
          echo "=== KÍCH THƯỚC DOCKER IMAGES SAU KHI NÉN GZIP ==="
          ls -lh dist-images/

      - name: Kiểm tra cấu hình SSH Secret trên GitHub
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && [ -z "${{ secrets.SSH_PASSWORD }}" ]; then
            echo "::error::CHƯA CẤU HÌNH SSH SECRET TRÊN GITHUB!"
            echo "::error::Vui lòng vào GitHub: Settings -> Secrets and variables -> Actions -> Tạo biến 'SSH_PASSWORD' (mật khẩu root của server 14.225.217.232) hoặc 'SSH_PRIVATE_KEY'!"
            exit 1
          fi

      - name: Chuẩn bị thư mục và dọn dẹp giải phóng dung lượng ổ đĩa trên VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE || '' }}
          password: ${{ secrets.SSH_PASSWORD || '' }}
          timeout: 300s
          command_timeout: 300s
          script: |
            echo ">>> [1/4] Dọn dẹp sạch sẽ thư mục deploy-cache và tệp nén của CEO 1983..."
            rm -rf /root/deploy-cache /tmp/*frontend-images*.tar.gz /tmp/*backend-images*.tar.gz /root/association/*.tar.gz /root/crm/*.tar.gz
            mkdir -p /root/deploy-cache/dist-images
            mkdir -p /root/deploy-cache/deploy
            
            echo ">>> [2/4] Xả sạch log của riêng các container CEO 1983 & CRM..."
            for cid in $(docker ps -a --filter "name=ceo1983" --filter "name=crm" -q 2>/dev/null); do
              lpath=$(docker inspect --format='{{.LogPath}}' "$cid" 2>/dev/null)
              [ -n "$lpath" ] && [ -f "$lpath" ] && truncate -s 0 "$lpath" 2>/dev/null || true
            done
            journalctl --vacuum-size=50M 2>/dev/null || true
            apt-get clean 2>/dev/null || true

            echo ">>> [3/4] Giải phóng Docker dangling images (<none>) và builder cache..."
            docker image prune -f 2>/dev/null || true
            docker builder prune -f 2>/dev/null || true

            echo ">>> [4/4] KIỂM TRA DUNG LƯỢNG Ổ ĐĨA TRÊN VPS SAU KHI DỌN DẸP:"
            df -h /

      - name: Đẩy images và cấu hình sang Server VPS qua SSH Pipe Stream
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
          TARGET_HOST: ${{ env.SERVER_IP }}
          TARGET_USER: ${{ env.SERVER_USER }}
        run: |
          set -e
          echo ">>> [1/4] Cài đặt sshpass và cấu hình OpenSSH Client trên GitHub Runner..."
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client

          # Cấu hình SSH Client với KeepAlive liên tục để không bao giờ bị ngắt kết nối
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 15
            ServerAliveCountMax 60
            TCPKeepAlive yes
            ConnectTimeout 60
          EOF
          chmod 600 ~/.ssh/config

          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=60"

          if [ -n "$SSH_KEY" ]; then
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            SSH_CMD="ssh -i ~/.ssh/id_rsa $SSH_OPTS ${TARGET_USER}@${TARGET_HOST}"
            echo ">>> Xác thực bằng SSH Private Key."
          elif [ -n "$SSH_PASS" ]; then
            echo "$SSH_PASS" > /tmp/sshpass.txt
            chmod 600 /tmp/sshpass.txt
            SSH_CMD="sshpass -f /tmp/sshpass.txt ssh $SSH_OPTS ${TARGET_USER}@${TARGET_HOST}"
            echo ">>> Xác thực bằng SSH Password qua sshpass an toàn."
          else
            echo "::error::Không có SSH_PRIVATE_KEY hoặc SSH_PASSWORD!"
            exit 1
          fi

          echo ">>> [2/4] Đảm bảo thư mục đích trên VPS tồn tại..."
          $SSH_CMD "mkdir -p /root/deploy-cache/dist-images /root/deploy-cache/deploy"

          echo ">>> [3/4] Truyền thư mục cấu hình deploy/ sang VPS qua Tar SSH Pipe..."
          for attempt in 1 2 3; do
            echo ">>> Đang nén và stream deploy/ sang VPS (lần $attempt/3)..."
            tar -C deploy -cf - . | $SSH_CMD "tar -C /root/deploy-cache/deploy -xf -" && break || {
              if [ $attempt -eq 3 ]; then
                echo "::error::Truyền deploy/ thất bại sau 3 lần thử!"
                rm -f /tmp/sshpass.txt
                exit 1
              fi
              echo ">>> Thử lại sau 5 giây..."
              sleep 5
            }
          done
          echo ">>> Đã truyền xong cấu hình deploy/ sang VPS!"

          echo ">>> [4/4] Truyền Docker Images sang VPS qua SSH Stream..."
          echo ">>> 1. Đang stream Frontend Image (~35MB)..."
          for attempt in 1 2 3; do
            cat dist-images/frontend-images.tar.gz | $SSH_CMD "cat > /root/deploy-cache/dist-images/frontend-images.tar.gz" && break || {
              if [ $attempt -eq 3 ]; then
                echo "::error::Truyền frontend-images.tar.gz thất bại sau 3 lần thử!"
                rm -f /tmp/sshpass.txt
                exit 1
              fi
              echo ">>> Thử lại sau 5 giây..."
              sleep 5
            }
          done
          echo ">>> Đã stream xong Frontend Image!"

          echo ">>> 2. Đang stream Backend Image (~170MB)..."
          for attempt in 1 2 3; do
            cat dist-images/backend-images.tar.gz | $SSH_CMD "cat > /root/deploy-cache/dist-images/backend-images.tar.gz" && break || {
              if [ $attempt -eq 3 ]; then
                echo "::error::Truyền backend-images.tar.gz thất bại sau 3 lần thử!"
                rm -f /tmp/sshpass.txt
                exit 1
              fi
              echo ">>> Thử lại sau 5 giây..."
              sleep 5
            }
          done
          echo ">>> Đã stream xong Backend Image!"

          echo ">>> [Kiểm tra xác nhận] Nội dung đã nhận trên VPS:"
          $SSH_CMD "ls -la /root/deploy-cache/deploy && ls -lh /root/deploy-cache/dist-images"

          rm -f /tmp/sshpass.txt
          echo ">>> [HOÀN TẤT] Đồng bộ toàn bộ cấu hình và Images sang VPS thành công 100%!"

      - name: Kích hoạt Container & Cập nhật Subdomains trên Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE || '' }}
          password: ${{ secrets.SSH_PASSWORD || '' }}
          timeout: 1200s
          command_timeout: 1200s
          script: |
            set -e
            echo ">>> [1/5] Nạp Docker Images vào Docker Daemon trên VPS..."
            cd /root/deploy-cache/
            FE_TAR=""
            [ -f dist-images/frontend-images.tar.gz ] && FE_TAR="dist-images/frontend-images.tar.gz"
            [ -f frontend-images.tar.gz ] && FE_TAR="frontend-images.tar.gz"
            if [ -n "$FE_TAR" ]; then
              echo ">>> Nạp $FE_TAR..."
              docker load < "$FE_TAR"
              docker tag ceo1983-frontend:latest crm-frontend:latest 2>/dev/null || true
              rm -f "$FE_TAR"
              echo ">>> Nạp và gắn tag Frontend Image thành công!"
            else
              echo ">>> [CẢNH BÁO] Không tìm thấy frontend-images.tar.gz!"
            fi

            BE_TAR=""
            [ -f dist-images/backend-images.tar.gz ] && BE_TAR="dist-images/backend-images.tar.gz"
            [ -f backend-images.tar.gz ] && BE_TAR="backend-images.tar.gz"
            if [ -n "$BE_TAR" ]; then
              echo ">>> Nạp $BE_TAR..."
              docker load < "$BE_TAR"
              docker tag ceo1983-backend:latest crm-backend:latest 2>/dev/null || true
              rm -f "$BE_TAR"
              echo ">>> Nạp và gắn tag Backend Image thành công!"
            else
              echo ">>> [CẢNH BÁO] Không tìm thấy backend-images.tar.gz!"
            fi

            echo ">>> [2/5] Đảm bảo mạng nội bộ ceo1983-network & vione-network..."
            docker network create ceo1983-network 2>/dev/null || true
            docker network create vione-network 2>/dev/null || true

            echo ">>> [3/5] Đồng bộ và khởi động Mobile CEO 1983 (https://ceo1983.viconnect.vn)..."
            mkdir -p /root/association
            cp -a /root/deploy-cache/deploy/ceo1983/. /root/association/
            cd /root/association
            sed -i 's/\r$//' docker-compose.yml .env.association .env.production 2>/dev/null || true
            docker compose -f docker-compose.yml stop 2>/dev/null || true
            docker rm -f ceo1983-frontend-prod ceo1983-backend-prod 2>/dev/null || true
            docker compose -f docker-compose.yml up -d --force-recreate
            sleep 3
            echo "--- TRẠNG THÁI CONTAINER MOBILE CEO 1983 ---"
            docker ps -a --filter name=ceo1983 --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            docker logs --tail 15 ceo1983-frontend-prod 2>&1 || true

            echo ">>> [4/5] Đồng bộ và khởi động CRM Hiệp Hội (https://crm.ceo1983.viconnect.vn)..."
            mkdir -p /root/crm
            cp -a /root/deploy-cache/deploy/crm/. /root/crm/
            cd /root/crm
            sed -i 's/\r$//' docker-compose.yml .env.crm .env.production 2>/dev/null || true
            docker compose -f docker-compose.yml stop 2>/dev/null || true
            docker rm -f crm-frontend-prod crm-backend-prod 2>/dev/null || true
            docker compose -f docker-compose.yml up -d --force-recreate
            sleep 3
            echo "--- TRẠNG THÁI CONTAINER CRM ---"
            docker ps -a --filter name=crm --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            docker logs --tail 15 crm-frontend-prod 2>&1 || true
            docker logs --tail 15 crm-backend-prod 2>&1 || true

            echo ">>> [5/5] Cập nhật Nginx Reverse Proxy SSL..."
            mkdir -p /root/ssl-proxy
            cp -a /root/deploy-cache/deploy/ssl/. /root/ssl-proxy/
            cd /root/ssl-proxy
            sed -i 's/\r$//' nginx.conf docker-compose.ssl.yml setup-ssl.sh 2>/dev/null || true
            bash setup-ssl.sh 2>&1 || echo ">>> [Canh bao] setup-ssl.sh co canh bao nhung cac container van chay on dinh."

            echo ">>> [6/6] Dọn dẹp tệp tin tạm deploy-cache để tiết kiệm dung lượng đĩa VPS..."
            rm -rf /root/deploy-cache 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
            docker builder prune -f 2>/dev/null || true
            echo "=== DUNG LƯỢNG Ổ ĐĨA TRÊN VPS SAU KHI TRIỂN KHAI HOÀN TẤT ==="
            df -h /

            echo "=========================================================================="
            echo " AUTO DEPLOY SUBDOMAINS HOÀN TẤT THÀNH CÔNG!"
            echo " 1. Mobile CEO 1983 Subdomain : https://ceo1983.viconnect.vn"
            echo " 2. Web CRM Subdomain         : https://crm.ceo1983.viconnect.vn"
            echo " 3. Test Dev Link Mobile      : http://14.225.217.232:5002 | https://14.225.217.232:5444"
            echo " 4. Test Dev Link CRM         : http://14.225.217.232:5004 | https://14.225.217.232:5443"
            echo "=========================================================================="
