services:
  ceo1983-frontend:
    image: ${ASSOCIATION_FE_IMAGE:-ceo1983-frontend}:latest
    container_name: ceo1983-frontend-prod
    restart: always
    mem_limit: 1024m
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env.association
    environment:
      - PORT=8080
      - NITRO_PORT=8080
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=768
      - NEST_API_URL=http://ceo1983-backend:4000
      - VITE_APP_SCOPE=association_app
      - VITE_APP_NAME="CLB Doanh Nhân CEO 1983"
      - VITE_APP_DEFAULT_ROUTE=/association
    user: "0:0"
    ports:
      - "${ASSOCIATION_PORT_FRONTEND:-5002}:8080"
    depends_on:
      - ceo1983-backend
    networks:
      - ceo1983-network
      - ceo1983-internal

  ceo1983-backend:
    image: ${ASSOCIATION_BE_IMAGE:-ceo1983-backend}:latest
    container_name: ceo1983-backend-prod
    restart: always
    mem_limit: 1024m
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env.association
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NODE_OPTIONS=--max-old-space-size=768
      - APP_SCOPE=association_app
      - DOCKER_CONTAINER=true
    user: "0:0"
    volumes:
      - ceo1983-uploads-data:/app/uploads
    ports:
      - "${ASSOCIATION_PORT_BACKEND:-5003}:4000"
    networks:
      ceo1983-network:
        aliases:
          - ceo1983-backend
      ceo1983-internal:
        aliases:
          - backend
          - ceo1983-backend

volumes:
  ceo1983-uploads-data:
    name: ceo1983-uploads-data

networks:
  ceo1983-network:
    name: ceo1983-network
    external: true
  ceo1983-internal:
    name: ceo1983-internal
    driver: bridge
