user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # SSL Global Settings
    ssl_certificate      /etc/nginx/ssl/server.crt;
    ssl_certificate_key  /etc/nginx/ssl/server.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    # Docker Internal DNS Resolver (Cho phép Nginx khởi động linh hoạt khi container upstreams nạp lại)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # =========================================================================
    # 0. HTTP PORT 80 - TỰ ĐỘNG CHUYỂN HƯỚNG TOÀN BỘ SANG HTTPS
    # =========================================================================
    server {
        listen 80;
        server_name ceo1983.viconnect.vn crm.ceo1983.viconnect.vn 14.225.217.232 localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 1. SUBDOMAIN MOBILE CEO 1983 (PORT 443 HTTPS): https://ceo1983.viconnect.vn
    # Forward tới ceo1983-frontend-prod:8080 & ceo1983-backend-prod:4000
    # =========================================================================
    server {
        listen 443 ssl;
        server_name ceo1983.viconnect.vn;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /sw.js {
            set $upstream_ceo "http://ceo1983-frontend-prod:8080";
            proxy_pass $upstream_ceo;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location /assets/ {
            set $upstream_ceo "http://ceo1983-frontend-prod:8080";
            proxy_pass $upstream_ceo;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            set $upstream_ceo "http://ceo1983-frontend-prod:8080";
            proxy_pass $upstream_ceo;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location /api/ {
            set $upstream_ceo_api "http://ceo1983-backend-prod:4000";
            proxy_pass $upstream_ceo_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /uploads/ {
            set $upstream_ceo_uploads "http://ceo1983-backend-prod:4000";
            proxy_pass $upstream_ceo_uploads;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /upload/ {
            rewrite ^/upload/(.*)$ /api/upload/$1 break;
            set $upstream_ceo_upload "http://ceo1983-backend-prod:4000";
            proxy_pass $upstream_ceo_upload;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /socket.io/ {
            set $upstream_ceo_ws "http://ceo1983-backend-prod:4000";
            proxy_pass $upstream_ceo_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

