services:
  ssl-reverse-proxy:
    image: nginx:alpine
    container_name: ceo1983-ssl-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "5443:5443"
      - "5444:5444"
      - "5445:5445"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./server.crt:/etc/nginx/ssl/server.crt:ro
      - ./server.key:/etc/nginx/ssl/server.key:ro
    networks:
      - ceo1983-network

networks:
  ceo1983-network:
    external: true
    name: ceo1983-network
